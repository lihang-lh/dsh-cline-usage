<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Cline usage board">
  <defs>
    <linearGradient id="cu-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#0b3d91"/>
    </linearGradient>
    <linearGradient id="cu-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#d2ffdc"/>
    </linearGradient>
  </defs>
  <!-- 圆角底板：代表「看板」面板 -->
  <rect x="1.5" y="3.5" width="29" height="25" rx="6" fill="url(#cu-bg)"/>
  <!-- 顶栏：余额读数 -->
  <rect x="5" y="7" width="13" height="3" rx="1.5" fill="#d2ffdc" opacity="0.92"/>
  <circle cx="22.5" cy="8.5" r="2.2" fill="#7ee787"/>
  <!-- 四根柱状图：上行/下行 token 与花费趋势 -->
  <rect x="6" y="17" width="3.4" height="7" rx="1.2" fill="url(#cu-bar)"/>
  <rect x="11.2" y="14" width="3.4" height="10" rx="1.2" fill="url(#cu-bar)"/>
  <rect x="16.4" y="19" width="3.4" height="5" rx="1.2" fill="url(#cu-bar)" opacity="0.8"/>
  <rect x="21.6" y="12.5" width="3.4" height="11.5" rx="1.2" fill="url(#cu-bar)"/>
  <!-- 底部基线 -->
  <rect x="5" y="25.4" width="20" height="1.2" rx="0.6" fill="#ffffff" opacity="0.35"/>
</svg>
